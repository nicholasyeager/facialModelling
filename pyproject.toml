[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "facial-fire"
version = "0.3.0"
description = "Local face-attached color propagation portfolio project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe==0.10.32",
    "opencv-contrib-python==4.11.0.86",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
facial-fire = "facial_fire.app:main"

[tool.scikit-build]
cmake.version = ">=3.20,<4"
cmake.build-type = "Release"
wheel.packages = ["src/facial_fire"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
