[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-fire"
version = "0.1.0"
description = "Local face-attached color propagation portfolio project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe==0.10.32",
    "opencv-contrib-python==4.11.0.86",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
facial-fire = "facial_fire.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
