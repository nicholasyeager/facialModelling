name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows / Python 3.11 / OpenMP
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies and build native extension
        run: python -m pip install -e '.[dev]' --config-settings 'cmake.define.FACIAL_FIRE_OPENMP=ON'

      - name: Require OpenMP support
        run: python -c "from facial_fire._native import openmp_available; assert openmp_available, 'CI requires OpenMP so parallel correctness tests cannot silently skip'"

      - name: Run headless tests
        run: python -m pytest -q -ra
